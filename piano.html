<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Web Piano Visualizer</title>

    <link rel="stylesheet" href="Piano/CSS/piano.css">

    <!-- Tone.js -->
    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>

    <!-- MIDI Parser -->
    <script src="https://unpkg.com/@tonejs/midi@2.0.28/build/Midi.js"></script>
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="title">
            <span>🎹</span>
            <span>Web Piano Visualizer</span>
        </div>

        <div class="file-area">
            <label class="file-button">
                MIDIを読み込む
                <input id="midiFile" type="file" accept=".mid,.midi">
            </label>

            <span id="fileName">MIDI未選択</span>
        </div>
    </header>


    <main class="main">

        <section class="visualizer">

            <div class="visualizer-header">
                <div>
                    <span id="songName">MIDIを読み込んでください</span>
                </div>

                <div class="time">
                    <span id="currentTime">00:00</span>
                    /
                    <span id="totalTime">00:00</span>
                </div>
            </div>


            <!-- 落下エリア -->
            <div id="noteArea">

                <div class="hit-line">
                    <div class="hit-glow"></div>
                </div>

                <div id="notes"></div>

            </div>


            <!-- ピアノ -->
            <div id="piano" class="piano"></div>

        </section>


        <section class="controls">

            <button id="playButton" class="control-button">
              <i class="fa-etch fa-solid fa-play"></i>
              再生
            </button>

            <button id="pauseButton" class="control-button">
              <i class="fa-utility fa-semibold fa-pause"></i>
              一時停止
            </button>

            <button id="stopButton" class="control-button">
              <i class="fa-etch fa-solid fa-rectangle"></i>
              最初から
            </button>

            <div class="volume">
                <span>🔊</span>
                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.7"
                >
            </div>

        </section>


        <section class="progress-section">

            <input
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.01"
            >

        </section>


        <section class="info">

            <div>
                <strong>操作</strong>
            </div>

            <div>
                MIDIを読み込むと、ノートが上から落下します。
            </div>

            <div>
                ピアノ鍵盤をクリック・タップして直接演奏することもできます。
            </div>

        </section>

    </main>

</div>

<script src="Piano/JS/piano.js"></script>

</body>
</html>
