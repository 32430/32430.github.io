<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Web Piano Visualizer</title>

    <link
        rel="stylesheet"
        href="Piano/CSS/piano.css"
    >

    <!-- Tone.js -->
    <script
        src="https://unpkg.com/tone@15.1.22/build/Tone.js"
    ></script>

</head>


<body>

<div class="app">

    <!-- =========================
         Header
    ========================== -->

    <header class="topbar">

        <div class="title">

            <span>🎹</span>

            <span>
                Web Piano Visualizer
            </span>

        </div>


        <div class="file-area">

            <label class="file-button">

                MIDIを読み込む

                <input
                    id="midiFile"
                    type="file"
                    accept=".mid,.midi"
                >

            </label>


            <span id="fileName">
                MIDI未選択
            </span>

        </div>

    </header>



    <!-- =========================
         Main
    ========================== -->

    <main class="main">


        <!-- =========================
             Visualizer
        ========================== -->

        <section class="visualizer">


            <!-- Song header -->

            <div class="visualizer-header">

                <div>

                    <span id="songName">
                        MIDIを読み込んでください
                    </span>

                </div>


                <div class="time">

                    <span id="currentTime">
                        00:00
                    </span>

                    <span>
                        /
                    </span>

                    <span id="totalTime">
                        00:00
                    </span>

                </div>

            </div>



            <!-- =========================
                 Falling Notes Area
            ========================== -->

            <div id="noteArea">


                <!-- Hit line -->

                <div class="hit-line">

                    <div class="hit-glow"></div>

                </div>


                <!-- Notes -->

                <div id="notes"></div>


            </div>



            <!-- =========================
                 Piano
            ========================== -->

            <div
                id="piano"
                class="piano"
            ></div>


        </section>



        <!-- =========================
             Controls
        ========================== -->

        <section class="controls">


            <button
                id="playButton"
                class="control-button"
            >
                再生
            </button>


            <button
                id="pauseButton"
                class="control-button"
            >
                一時停止
            </button>


            <button
                id="stopButton"
                class="control-button"
            >
                最初から
            </button>



            <div class="volume">

                <span>
                    🔊
                </span>

                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.7"
                >

            </div>


        </section>



        <!-- =========================
             Progress
        ========================== -->

        <section class="progress-section">

            <input
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.01"
            >

        </section>


    </main>

</div>



<!-- =========================
     Main JavaScript

     IMPORTANT:
     type="module"
========================== -->

<script
    type="module"
    src="Piano/JS/piano.js"
></script>


</body>

</html>
