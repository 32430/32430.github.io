<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord & florr.io Notification</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    #notification-container {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #4CAF50;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #4CAF50;
      text-align: center;
    }
    #notification-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #notification-list li {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
      word-break: break-all;
      font-size: 0.95rem;
    }
    #notification-list li img {
      display: block;
      margin-top: 8px;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .timestamp {
      font-size: 0.8rem;
      color: #aaa;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div id="notification-container">
    <h1>Captured Media (Max 10)</h1>
    <ul id="notification-list">
      <li>接続中...</li>
    </ul>
  </div>

  <script>
    function renderList(list) {
      const listElem = document.getElementById('notification-list');
      if (!list || list.length === 0) {
        listElem.innerHTML = '<li>まだデータはありません</li>';
        return;
      }

      listElem.innerHTML = list.map(item => {
        let content = '';
        if (item.url) {
          content = `<a href="${item.url}" target="_blank" style="color: #4CAF50;">${item.url}</a>
                     <img src="${item.url}" alt="Captured Image">`;
        } else {
          content = `<span>${item.message || JSON.stringify(item)}</span>`;
        }
        const timeStr = item.timestamp ? new Date(item.timestamp).toLocaleTimeString() : '';
        return `<li>${content}<span class="timestamp">${timeStr}</span></li>`;
      }).join('');
    }

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
      const ws = new WebSocket(protocol + location.host);

      ws.onopen = () => {
        console.log('WebSocket接続確立');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          // サーバーから送られる形式（init または update の配列）に対応
          if (data.list && Array.isArray(data.list)) {
            renderList(data.list);
          } else if (Array.isArray(data)) {
            renderList(data);
          }
        } catch (e) {
          console.error('データ解析エラー', e);
        }
      };

      ws.onclose = () => {
        console.log('WebSocket切断。3秒後に再接続します...');
        document.getElementById('notification-list').innerHTML = '<li>再接続中...</li>';
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (error) => {
        console.error('WebSocketエラー', error);
        ws.close();
      };
    }

    connectWebSocket();
  </script>

</body>
</html>
