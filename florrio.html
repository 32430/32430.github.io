<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>florrio - Screen Monitor</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .card {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #4CAF50;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      text-align: center;
    }
    h2 {
      color: #4CAF50;
      margin-top: 0;
    }
    video {
      width: 100%;
      max-height: 400px;
      background: #000;
      border-radius: 6px;
      object-fit: contain;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:active {
      background: #388E3C;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- スマホ側：画面共有開始ボタン -->
    <div class="card">
      <h2>スマホ画面配信用</h2>
      <p style="font-size: 0.9rem; color: #ccc;">下のボタンを押して、Discordを開いているタブや画面を選択してください。</p>
      <button id="startShare">画面共有を開始する</button>
    </div>

    <!-- プレビュー画面（自分または他人が見る用） -->
    <div class="card">
      <h2>Live Stream Monitor</h2>
      <video id="remoteVideo" autoplay playsinline controls></video>
    </div>
  </div>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const ws = new WebSocket(protocol + location.host);
    let pc;
    let localStream;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // WebSocket受信処理（WebRTCシグナリング）
    ws.onmessage = async (event) => {
      try {
        const data = JSON.parse(event.data);

        if (data.type === 'offer') {
          // 配信側からのオファーを受信した場合（受信側ビューアーの処理）
          pc = new RTCPeerConnection(rtcConfig);
          pc.ontrack = (e) => {
            document.getElementById('remoteVideo').srcObject = e.streams[0];
          };
          pc.onicecandidate = (e) => {
            if (e.candidate) ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
          };
          await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: 'answer', answer: answer }));

        } else if (data.type === 'answer' && pc) {
          // 配信側がアンサーを受信した場合
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));

        } else if (data.type === 'candidate' && pc) {
          await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      } catch (e) {
        console.error('Signaling error:', e);
      }
    };

    // 「画面共有を開始する」ボタンを押したときの処理（スマホ側）
    document.getElementById('startShare').onclick = async () => {
      try {
        // getDisplayMediaで画面キャプチャを取得
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: false
        });

        // 自分の画面プレビューにも映す
        document.getElementById('remoteVideo').srcObject = localStream;

        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', offer: offer }));

        alert('画面共有を開始しました！');
      } catch (err) {
        console.error('getDisplayMedia error:', err);
        alert('画面共有の取得に失敗しました: ' + err.message);
      }
    };
  </script>

</body>
</html>
