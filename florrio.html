<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>florrio通知</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #notification-container {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #4CAF50;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #4CAF50;
    }
    #notification-text {
      font-size: 1.2rem;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="notification-container">
    <h1>florr.io Notification</h1>
    <p>最新の通知: <span id="notification-text">接続中...</span></p>
  </div>

  <script>
    function connectWebSocket() {
      // HTTPSの場合は wss://, HTTPの場合は ws:// に自動切り替え
      const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
      const ws = new WebSocket(protocol + location.host);

      ws.onopen = () => {
        console.log('WebSocket接続確立');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const textElem = document.getElementById('notification-text');
          if (data && data.message) {
            textElem.innerText = data.message;
          }
        } catch (e) {
          console.error('データ解析エラー', e);
        }
      };

      ws.onclose = () => {
        console.log('WebSocket切断。3秒後に再接続します...');
        document.getElementById('notification-text').innerText = '再接続中...';
        setTimeout(connectWebSocket, 3000); // 切断時は自動で再接続
      };

      ws.onerror = (error) => {
        console.error('WebSocketエラー', error);
        ws.close();
      };
    }

    connectWebSocket();
  </script>

</body>
</html>
